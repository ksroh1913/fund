name: Regenerate audit outputs

on:
  push:
    branches: [audit-revision-20260924]
    paths:
      - 'src/**'
      - 'data/**'
      - 'submission/team2_NPS_MVO_BL.ipynb'
      - 'requirements.txt'
      - '.github/workflows/regenerate-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-revision-20260924
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install jupyter nbconvert ipykernel
      - name: Execute notebook in place
        working-directory: submission
        run: |
          set +e
          jupyter nbconvert --to notebook --execute --inplace team2_NPS_MVO_BL.ipynb --ExecutePreprocessor.timeout=600 > ../workflow_run.log 2>&1
          status=$?
          cat ../workflow_run.log
          echo "$status" > ../workflow_status.txt
          exit 0
      - name: Commit regenerated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data results submission docs workflow_run.log workflow_status.txt
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Regenerate outputs from committed notebook"
            git push origin HEAD:audit-revision-20260924
          fi
